# Override: skip Docker cargo build, bind-mount host-built binary.
#
# Use with:
#   cargo build --release -p k3rs --features sqlite
#   docker compose -f compose.all-in-one.yml \
#                  -f compose.local-binary.all-in-one.yml \
#                  up -d --no-build
#
# Reuses k3rs-k3rs:latest as runtime base (ships iptables,
# iproute2, libssl3, ca-certificates) and overlays the freshly-built
# binary from target/release on the host.

services:
  k3rs:
    image: k3rs-k3rs:latest
    pull_policy: never
    volumes:
      - ./target/release/k3rs:/app/k3rs:ro
    environment:
      # Pod-facing endpoint: Docker bridge gateway [subnet].1 (set by
      # bootstrap at runtime via discover-bridge-gateway.sh). The host's
      # 6443:6443 port mapping forwards to the in-process api-server —
      # no known subnet required.
      - KUBERNETES_SERVICE_HOST_OVERRIDE=${DOCKER_GATEWAY}
    command:
      - "--storage-backend"
      - "sqlite"
      - "--data-dir"
      - "/data/db/k3rs.db"
      - "--tls"
      - "--enable-aggregator-routing=true"
      - "--tls-cert-file"
      - "/etc/kubernetes/pki/api-server.crt"
      - "--tls-key-file"
      - "/etc/kubernetes/pki/api-server.key"
      # Front-proxy authn (#3423): kubeadm flag set; CA/cert from generate-certs.sh.
      # Client-cert authn CA, as kubeadm passes it next to the front-proxy CA: without it the
      # listener trusts only the front-proxy CA and rejects cluster-CA client certs (#3423).
      - "--client-ca-file"
      - "/etc/kubernetes/pki/ca.crt"
      - "--requestheader-client-ca-file"
      - "/etc/kubernetes/pki/front-proxy-ca.crt"
      - "--requestheader-allowed-names"
      - "front-proxy-client"
      - "--requestheader-username-headers"
      - "X-Remote-User"
      - "--requestheader-group-headers"
      - "X-Remote-Group"
      - "--requestheader-extra-headers-prefix"
      - "X-Remote-Extra-"
      - "--skip-auth"
      # Listen on default 0.0.0.0:6443. Kubelet's env injection emits
      # KUBERNETES_SERVICE_PORT from the kubernetes Service's targetPort
      # (6443), not from `port` (443) — so binding 6443 means pods
      # connect to the same port the env vars advertise.
      - "--console-dir"
      - "/app/console"
      - "--network"
      - "k3rs-network"
      - "--cluster-dns"
      - "10.96.0.10"
      - "--volume-dir"
      - "${KUBELET_VOLUMES_PATH}"

name: Build ARC runner image

on:
  push:
    branches: [main]
    paths:
      - ci/arc-runner/Dockerfile
      - .github/workflows/build-runner-image.yml
  pull_request:
    paths:
      - ci/arc-runner/Dockerfile
      - .github/workflows/build-runner-image.yml
  workflow_dispatch:
  # The image is `FROM ghcr.io/actions/actions-runner:latest`, and GitHub
  # deprecates old runner versions: a runner too old to register exits 7 and
  # ARC parks every scale set in phase Outdated, so all self-hosted CI stops
  # (#2002). Rebuild weekly so the embedded runner keeps up.
  schedule:
    - cron: '17 4 * * 1'

env:
  IMAGE: ghcr.io/indyjonesnl/rusternetes-arc-runner

jobs:
  build:
    name: Build and push ARC runner image
    # GH-hosted on purpose: the ARC runner pods don't have a docker
    # daemon, and image builds are rare (Dockerfile changes plus the weekly
    # refresh), so the minute cost is acceptable. It also means this job
    # still runs when the ARC runners are down — which is exactly when a
    # fresh image is needed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # PR runs from forks don't get write packages — skip the login so
        # the build still verifies but won't try to push.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${short_sha}"
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "${IMAGE}:latest"
              # A scheduled rebuild of an unchanged commit gets a new base,
              # so it needs a tag of its own: pin the helm values to this one.
              # `:latest` cannot clear an Outdated scale set — only a change
              # to the ARS spec (a new image tag) does.
              echo "${IMAGE}:$(date -u +%Y%m%d)-${short_sha}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ci/arc-runner
          file: ci/arc-runner/Dockerfile
          # Re-resolve `actions-runner:latest` rather than reuse a cached base.
          pull: true
          # Publish from main — a push, the weekly schedule, or a manual
          # dispatch (a dispatch that only built was how #2002's recovery
          # first went wrong). PRs build but don't publish; forks skip the
          # login step above and so would fail to push anyway.
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

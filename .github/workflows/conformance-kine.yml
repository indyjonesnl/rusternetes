# Hand-written caller — deliberately NOT generated from ci/conformance/targets.json.
#
# kine is not a new test target: it is a different storage substrate under an
# existing one. The registry describes WHAT to run (a focus/skip pair); this
# workflow varies WHERE it runs by handing the engine a different compose
# stack. Adding a registry entry would imply a new slice of the conformance
# suite and would earn a badge of its own, neither of which is true here.
# scripts/tests/test-target-workflows-sync.sh skips files without the
# GENERATED marker, so this file is safe from the generator.
name: conformance-kine

# Runs storage-relevant [Conformance] slices against compose.kine.yml —
# the same topology as the default rhino/SQLite stack with kine (the etcd v3
# API shim k3s and k0s ship) in rhino's place.
#
# Why this is worth a nightly: kine implements only the RPC subset upstream
# Kubernetes' etcd3 store emits and rejects everything else with
# Unimplemented/InvalidArgument. That makes it an executable check that
# crates/storage/src/etcd.rs has not drifted back outside that subset — the
# cluster simply will not come up if it has. sig-api-machinery is the slice
# that leans hardest on the storage layer (watch, resourceVersion, paging,
# garbage collection), so it is the one worth spending the run on.
#
# crates/storage/tests/etcd_rpc_subset.rs pins the same constraint at the unit
# level and runs on every PR; this leg catches whole-cluster interactions the
# unit test cannot see.
on:
  schedule:
    - cron: '36 3 * * *'
  workflow_dispatch:
    inputs:
      focus:
        description: "Ginkgo --focus override (narrow to one test to prove a PR). Empty = the full target."
        required: false
        default: ''
      target:
        description: "Run a single target instead of the whole matrix (e.g. sig-storage)."
        required: false
        default: ''

concurrency:
  group: conformance-kine
  cancel-in-progress: true

jobs:
  run:
    # Measured against rhino on the same commit (aa6b25ac, 2026-09-02), so a
    # reviewer can tell a real change from the known gap:
    #
    #   target             kine    rhino
    #   sig-api-machinery  91/94   95/95
    #   sig-apps           59/60   60/60
    #   sig-storage        91/91   91/91
    #
    # The numbers above PREDATE #1845/#1848/#1849 and are kept only as the
    # "before" column; re-measure before treating them as current.
    #
    # Every kine-only failure is a [Serial] deletion/GC spec, and the failure
    # class is ours, not kine's. But they do NOT share one cause, and the
    # single-cause story this comment used to tell ("our GC is a polling scan
    # whose interval backs off 5->60s ... so orphan collection can take ~65s")
    # was wrong. It was investigated on 2026-09-02 (#1846) and splits in two:
    #
    #   * The two `Namespaces [Serial]` specs were NOT a GC timing race. Both
    #     poll for the namespace OBJECT to disappear within 60s (90s for the
    #     pod variant) - see test/e2e/apimachinery/namespace.go:131-139 and
    #     :188-196; despite their names neither asserts anything about orphan
    #     collection. One cause was that we accepted CREATE into a Terminating
    #     namespace, so a ReplicationController the namespace deleter had not
    #     reached yet kept recreating the pods it had just deleted. A namespace
    #     holding 100 pods took 158s to go away, with the pod count RISING
    #     mid-drain. #1849 ported upstream's NamespaceLifecycle admission and
    #     took that synthetic case 158s -> 36s.
    #
    #     It is NOT sufficient: both specs STILL FAIL on the full target
    #     (run 33640845357, `main`, 89/94), with the same
    #     "timed out waiting for the condition" at namespace.go:133 and :190
    #     after 124s and 133s. They pass in a FOCUSED run on an idle cluster
    #     and fail in the full 95-spec run, so do not verify these two with a
    #     focused run - the cluster state and concurrent load are part of what
    #     they measure. Hydrophone's own namespace teardown went 6-8+ min ->
    #     81s under full load (3s focused): a real improvement, still over the
    #     60-90s budget. #1846 is reopened; #1850 (DeleteCollection instead of
    #     N sequential per-object deletes) is the leading remaining candidate.
    #
    #   * The two `Garbage collector` specs never reach GC code at all. They
    #     fail in setup, waiting for `rc.Status.Replicas` to reach
    #     `Spec.Replicas` (garbage_collector.go:1174) while all 100 pods are
    #     demonstrably Running - i.e. the RC never publishes its status on the
    #     kine path. Tracked in #1847, still open.
    #
    # "Why kine crosses those budgets where rhino does not" is now partly
    # answered, and the answer was never about GC cadence: on rhino the same
    # namespace teardown takes 2.7s and all four focused specs pass, against
    # 6-8+ minutes on kine (both `main`, both built from source). Measured, not
    # assumed - the earlier claim that "rhino fails 0 of these" had never been
    # run.
    #
    # Two theories were measured and REFUTED; do not repeat either without new
    # evidence. (1) kine churning watches and starving the control loop: on an
    # idle cluster kine re-establishes 472 watches per 300s and rhino 473,
    # i.e. identical, and that rate is the api-server's own behaviour on both
    # backends. (2) `EtcdStorage::delete` silently no-opping: it is a guarded
    # txn that returns Conflict, and the repeated GC deletes seen in the logs
    # were api-server DELETEs correctly refused while `spec.finalizers`
    # remained (#1848 stopped the GC from issuing them).
    #
    # Lesson for whoever reads this next: a spec's NAME is not its assertion.
    # Read the spec source before attributing its failure to a mechanism.
    #
    # The engine is NON-GATING, so these show as reported numbers rather than a
    # red job. Treat a DROP from the table above as the signal.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event.inputs.target != '' && fromJSON(format('["{0}"]', github.event.inputs.target)) || fromJSON('["sig-api-machinery","sig-apps","sig-storage"]') }}
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/conformance-target.yml
    with:
      target: ${{ matrix.target }}
      compose-file: compose.kine.yml
      focus: ${{ github.event.inputs.focus || '' }}
      # Always build this ref from source. The published GHCR tags track main,
      # so a prebuilt image would test main's storage code rather than the code
      # under review — and on a leg whose entire purpose is to detect storage
      # drift, that is the one thing it must not do. ('local' is the sentinel
      # the engine maps to the empty tag the bring-up action wants; see #1760
      # for why it is not mapped with a `${{ }}` expression.)
      image-tag: local
      # The badge belongs to the target, and this is not the target's pass rate
      # on its default stack — same rule that keeps focused runs off the badge
      # (FR-011).
      publish-badge: false

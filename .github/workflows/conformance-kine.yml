# Hand-written caller — deliberately NOT generated from ci/conformance/targets.json.
#
# kine is not a new test target: it is a different storage substrate under an
# existing one. The registry describes WHAT to run (a focus/skip pair); this
# workflow varies WHERE it runs by handing the engine a different compose
# stack. Adding a registry entry would imply a new slice of the conformance
# suite and would earn a badge of its own, neither of which is true here.
# scripts/tests/test-target-workflows-sync.sh skips files without the
# GENERATED marker, so this file is safe from the generator.
name: conformance-kine

# Runs storage-relevant [Conformance] slices against compose.kine.yml —
# the same topology as the default rhino/SQLite stack with kine (the etcd v3
# API shim k3s and k0s ship) in rhino's place.
#
# Why this is worth a nightly: kine implements only the RPC subset upstream
# Kubernetes' etcd3 store emits and rejects everything else with
# Unimplemented/InvalidArgument. That makes it an executable check that
# crates/storage/src/etcd.rs has not drifted back outside that subset — the
# cluster simply will not come up if it has. sig-api-machinery is the slice
# that leans hardest on the storage layer (watch, resourceVersion, paging,
# garbage collection), so it is the one worth spending the run on.
#
# crates/storage/tests/etcd_rpc_subset.rs pins the same constraint at the unit
# level and runs on every PR; this leg catches whole-cluster interactions the
# unit test cannot see.
on:
  schedule:
    - cron: '36 3 * * *'
  workflow_dispatch:
    inputs:
      focus:
        description: "Ginkgo --focus override (narrow to one test to prove a PR). Empty = the full target."
        required: false
        default: ''
      target:
        description: "Run a single target instead of the whole matrix (e.g. sig-storage)."
        required: false
        default: ''

concurrency:
  group: conformance-kine
  cancel-in-progress: true

jobs:
  run:
    # kine sig-api-machinery on main, most recent first. Re-measure before
    # treating any of these as current; a [Serial] failure set rotates, so a
    # single run is a data point, not a verdict.
    #
    #   ref         run           result   note
    #   fac97fb7    33842493018   93/2     GC fan-out (#1858) + panic fix (#1861)
    #   a2f9ed00    33816713163   87/8     REVERTED state - see the throttle note
    #   b6401c71    33806856684   92/3     expectations brake (#1854) landed
    #   aa6b25ac    -             91/4     the original "before" column
    #
    # For contrast on the same 2026-09-02 commit: rhino ran sig-api-machinery
    # 95/95, sig-apps 60/60, sig-storage 91/91. kine ran sig-apps 59/60 and
    # sig-storage 91/91.
    #
    # What is actually fixed, and by what:
    #
    #   * Both `Namespaces [Serial]` specs pass (#1846, closed on two
    #     consecutive full runs). #1849 ported upstream's NamespaceLifecycle
    #     admission so a CREATE into a Terminating namespace is refused; that
    #     was necessary but NOT sufficient. #1854 finished it with upstream's
    #     expectations brake, which stops the RC re-issuing creates it has
    #     already issued but not yet observed - the loop that kept a draining
    #     namespace's pod count from reaching zero.
    #
    #   * `should orphan pods created by rc if delete options say so` and
    #     `should keep the rc around until all its pods are deleted` pass as of
    #     #1858. They were NOT a kine-specific timing quirk: our GC walked an
    #     owner's dependents serially, so orphaning 100 pods cost 100 round
    #     trips against a 120s budget. Upstream fans out one goroutine per
    #     dependent (garbagecollector.go:673-696) and the e2e spec's own
    #     comment (test/e2e/apimachinery/garbage_collector.go:410-416) says the
    #     budget assumes exactly that.
    #
    #   * #1847 (rc.status.replicas stuck at 0, killing two specs in setup) no
    #     longer reproduces: garbage_collector.go:1174 appears zero times in
    #     the last three runs.
    #
    # Still failing:
    #
    #   * `should not delete dependents that have both valid owner and owner
    #     that's waiting for dependents to be deleted` - the tightest budget of
    #     the three at 90s, and the only GC spec #1858 did not clear.
    #
    #   * `ValidatingAdmissionPolicy ... API operations` failed once, in the
    #     93/2 run only (1 of 6). Watch-event delivery, not admission. Not yet
    #     classified as flake or regression - see #1865.
    #
    # A cautionary note, because it cost five hours of runner time: #1856 added
    # client-side rate limiting using upstream's controller-manager value of 20
    # QPS, and applied it to the ONE ApiClient all 31 controllers share.
    # Upstream gives each controller its own client and therefore its own
    # bucket (clientbuilder/client_builder.go:40-47 clones the config;
    # rest/config.go:370-381 builds a fresh limiter per client), so that was a
    # ~31x under-provision. It regressed this leg to 87/8 and left teardown
    # running 3.5 hours until the 300-minute job timeout, which surfaces as
    # `cancelled` rather than `failed`. Reverted in #1862; #1863 tracks the
    # correct re-land.
    #
    # Two theories were measured and REFUTED; do not repeat either without new
    # evidence. (1) kine churning watches and starving the control loop: on an
    # idle cluster kine re-establishes 472 watches per 300s and rhino 473,
    # i.e. identical, and that rate is the api-server's own behaviour on both
    # backends. (2) `EtcdStorage::delete` silently no-opping: it is a guarded
    # txn that returns Conflict, and the repeated GC deletes seen in the logs
    # were api-server DELETEs correctly refused while `spec.finalizers`
    # remained (#1848 stopped the GC from issuing them).
    #
    # A third is worth adding to that list: the failures were long attributed
    # to GC scan cadence backing off 5->60s. That was wrong too. The cost was
    # serial dependent I/O, not poll latency.
    #
    # Lesson for whoever reads this next: a spec's NAME is not its assertion,
    # and its ERROR TEXT is not its cause. These specs reported
    # `client rate limiter Wait returned an error`, which reads like the
    # suite being starved of api-server capacity. It was not - that is
    # x/time/rate declining a token because the poll's own deadline was
    # already nearly up. Read the spec source.
    #
    # The engine is NON-GATING, so these show as reported numbers rather than a
    # red job. Treat a DROP from the table above as the signal.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event.inputs.target != '' && fromJSON(format('["{0}"]', github.event.inputs.target)) || fromJSON('["sig-api-machinery","sig-apps","sig-storage"]') }}
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/conformance-target.yml
    with:
      target: ${{ matrix.target }}
      compose-file: compose.kine.yml
      focus: ${{ github.event.inputs.focus || '' }}
      # Always build this ref from source. The published GHCR tags track main,
      # so a prebuilt image would test main's storage code rather than the code
      # under review — and on a leg whose entire purpose is to detect storage
      # drift, that is the one thing it must not do. ('local' is the sentinel
      # the engine maps to the empty tag the bring-up action wants; see #1760
      # for why it is not mapped with a `${{ }}` expression.)
      image-tag: local
      # The badge belongs to the target, and this is not the target's pass rate
      # on its default stack — same rule that keeps focused runs off the badge
      # (FR-011).
      publish-badge: false

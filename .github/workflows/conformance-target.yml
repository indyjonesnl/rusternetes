name: conformance-target (reusable)

# Reusable per-target conformance engine. Brings up the multi-container SQLite
# (rhino) stack via the shared `bring-up-cluster` action, runs ONE target's
# focus (a SIG's [Conformance] slice, or a curated feature focus) through
# Hydrophone, publishes a dynamic passed/total badge, and tears down.
#
# The thin per-target callers (.github/workflows/conformance-<name>.yml,
# generated from ci/conformance/targets.json) invoke this with their `target`.
# It is also directly `workflow_dispatch`-able for ad-hoc runs.
#
# NON-GATING: test failures do NOT fail the job — only an infra failure (no
# junit) does (see scripts/conformance-target-run.sh). A FOCUSED run (non-empty
# `focus`) runs the tests but does NOT publish the badge — a one-test count is
# not the target's pass rate (FR-011).

on:
  workflow_call:
    inputs:
      target:
        description: "Target name (must exist in ci/conformance/targets.json)"
        required: true
        type: string
      focus:
        description: "Ginkgo --focus override. Empty = full target run (publishes badge)."
        required: false
        type: string
        default: ''
      image-tag:
        description: "GHCR image tag to test (default main). Empty = build locally."
        required: false
        type: string
        default: main
      publish-badge:
        description: "Publish the target badge on a full run (ignored for focused runs)."
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      target:
        description: "Target name (must exist in ci/conformance/targets.json)"
        required: true
        type: string
      focus:
        description: "Ginkgo --focus override. Empty = full target run (publishes badge)."
        required: false
        type: string
        default: ''
      image-tag:
        description: "GHCR image tag to test (default main). Empty = build locally."
        required: false
        type: string
        default: main
      publish-badge:
        description: "Publish the target badge on a full run (ignored for focused runs)."
        required: false
        type: boolean
        default: true

env:
  DOCKER_HOST: unix:///var/run/docker.sock
  HYDROPHONE_VERSION: v0.7.0

jobs:
  target:
    name: ${{ inputs.target }}${{ inputs.focus != '' && ' (focused)' || '' }}
    runs-on: arc-runner-set-conformance
    # contents:write lets the badge step push to the orphan `badges` branch
    # (best-effort; never fails the run).
    permissions:
      contents: write
    # A full SIG [Conformance] slice is much bigger than a single feature focus,
    # and every failing spec (rusternetes is not yet 100%) burns its per-test
    # ginkgo timeout — so this needs the old canary's ~300-min budget, not the
    # 90 min that timed out every SIG run → "cancelled" (#1616). Feature targets
    # are small and finish well inside this ceiling.
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bring up cluster
        uses: ./ci/actions/bring-up-cluster
        with:
          hydrophone-version: ${{ env.HYDROPHONE_VERSION }}
          kubectl-version: v1.35.0
          image-tag: ${{ inputs.image-tag }}

      - name: Run target conformance
        id: run
        env:
          TARGET: ${{ inputs.target }}
          FOCUS: ${{ inputs.focus }}
        run: |
          set -euo pipefail
          args=(--target "$TARGET" --output-dir "target-out/$TARGET")
          if [ -n "$FOCUS" ]; then
            args+=(--focus "$FOCUS")
          fi
          bash scripts/conformance-target-run.sh "${args[@]}"

      - name: Update target badge
        # Full runs only (empty focus) — a focused run must not clobber the
        # target's aggregate badge (FR-011). Best-effort: never reddens the run.
        if: ${{ always() && inputs.publish-badge && inputs.focus == '' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/update-badge.sh \
            "${{ inputs.target }}" "${{ inputs.target }}" \
            "${{ steps.run.outputs.passed }}" "${{ steps.run.outputs.total }}"

      - name: Upload target artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ inputs.target }}${{ inputs.focus != '' && '-focused' || '' }}
          path: target-out/${{ inputs.target }}/
          retention-days: 14

      - name: Tear down cluster
        if: always()
        run: |
          docker compose -f compose.sqlite.yml logs --tail=100 || true
          docker compose -f compose.sqlite.yml down -v || true

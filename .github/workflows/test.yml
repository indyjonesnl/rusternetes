name: Rust tests

on:
  # Run once per change: push events only fire for main (post-merge
  # validation); feature-branch pushes that have an open PR fire via
  # the pull_request `synchronize` event instead. Without the branch
  # filter every PR update would trigger two duplicate runs.
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# ONE job on the self-hosted ARC `arc-runner-set` scale set (large tier,
# ~8 GiB), which ships the Rust toolchain (clippy + rustfmt), cargo-nextest,
# and the system build deps (protoc + libprotobuf-dev, mold + clang,
# pkg-config + libssl-dev).
#
# clippy and nextest were previously two separate jobs on two pods. Each
# did a full cold workspace compile, and their combined schedule-time
# reservation (8 GiB nextest + 6 GiB clippy) could not co-fit on a single
# ~14 GiB node, so they serialized anyway. Merging them into one job:
#   - Collapses the two reservations into one 8 GiB pod (the steps run
#     sequentially, so peak = max(clippy, nextest) ≈ 8 GiB, not the sum) —
#     one node runs the whole PR check with no cross-pod contention.
#   - Shares the common dependency graph on warm `target/`: clippy compiles
#     it first, nextest reuses the dep rlibs instead of a second cold build
#     + sccache pull.
#
# Both feature configs are still compiled exactly once, preserving the
# original dual-config coverage:
#   - clippy runs with DEFAULT features — the no-sqlite build guard + lint.
#   - nextest runs WITH the `sqlite` feature. Features are additive and
#     there are no `cfg(not(feature="sqlite"))` tests, so this is a superset
#     of the default run (regular tests PLUS the rhino/SQLite-gated ones).
# clippy runs first as the cheap fail-fast gate (lint + no-sqlite build)
# before the longer test run.
#
# This job is the single REQUIRED status check for Rust. To keep it
# mergeable without burning a full compile on PRs that touch no Rust
# (docs / scripts / compose only), it stays always-triggered but gates its
# cache + build steps on a change-detection step — so the required check
# still reports green in seconds when there's no Rust to build. Pushes to
# main always run the full job.
jobs:
  checks:
    name: cargo clippy + nextest
    runs-on: arc-runner-set
    steps:
      - name: Checkout repository
        # rhino is an in-tree submodule (./rhino) resolving the storage crate's
        # `../../rhino` path dep. submodules: recursive checks it out pinned.
        # fetch-depth: 0 gives the change-detection diff the PR base commit.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Detect Rust-relevant changes
        id: rust
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
              | grep -qE '(\.rs|\.proto)$|(^|/)Cargo\.(toml|lock)$|(^|/)build\.rs$|^rhino($|/)|(^|/)rust-toolchain|^\.github/workflows/(test|fmt)\.yml$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Rust-relevant changes — skipping clippy + nextest (required check reports green)."
          fi

      - name: Cache cargo registry + target
        # ARC runner pods are ephemeral; rust-cache restores ~/.cargo
        # and target/ from the GitHub Actions cache scoped to
        # Cargo.lock + rustc version.
        #
        # `save-if: main only` is deliberate: PRs restore from the
        # cache main wrote on the most recent merge, then SKIP the
        # multi-GB upload at job end. Cache uploads from the ARC
        # cluster to the GHA cache service (Azure blob) were eating
        # 1-3 min per PR job; main pays that cost once per Cargo.lock
        # change. PRs that touch Cargo.lock will recompile new deps
        # but still benefit from the warm cache for everything else.
        #
        # One cache namespace for the merged job: a single `target/` now
        # holds both the default-feature (clippy) and sqlite (nextest)
        # artifacts, saved and restored together.
        if: steps.rust.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          shared-key: "checks"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy (hard gate, all targets)
        # Runs FIRST as the cheap fail-fast gate — a lint or no-sqlite build
        # break stops the job before the longer test run.
        #
        # `-- -D warnings` converts every clippy lint into a build error
        # so warnings cannot accrete unnoticed. Future PRs must keep clippy
        # green or `#[allow(<lint>)]` the specific case with a comment.
        #
        # Default features only: this is the no-sqlite build guard (the
        # nextest step below compiles the sqlite config), and the optional
        # `jaeger` feature pulls in opentelemetry-jaeger which is itself
        # deprecated upstream. clippy lints are therefore not run on the
        # `cfg(feature = "sqlite")` code paths — those are still compiled
        # (and type-checked) by the sqlite-enabled nextest step, just not
        # linted.
        #
        # `--all-targets` also acts as the bin-target build check the old
        # explicit `cargo build` step provided — clippy compiles every
        # target before lint, so any compile error in a bin fails this step.
        if: steps.rust.outputs.changed == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo nextest run
        # Reuses the common dependency artifacts clippy just built in
        # target/. Runs the whole workspace with the `sqlite` feature ON.
        # Features are additive and there are no `cfg(not(feature = "sqlite"))`
        # tests, so a single sqlite-enabled run is a SUPERSET of the default
        # run: it executes every default test PLUS the rhino/SQLite-gated ones
        # (e.g. watch_delivery_rhino_test.rs).
        #
        # `--status-level fail` suppresses per-test PASS lines; the final
        # summary still reports totals. `--no-fail-fast` surfaces every failure
        # in one run instead of stopping at the first. Doctests are not run
        # (nextest limitation) — none of the workspace depends on doctest
        # coverage; add a separate `cargo test --doc` step if that changes.
        if: steps.rust.outputs.changed == 'true'
        run: cargo nextest run --workspace --features rusternetes-api-server/sqlite --locked --no-fail-fast --status-level fail

      - name: sccache stats
        # Compilation cache hit-rate, for visibility. sccache itself is
        # configured cluster-side via the runner pod env (RUSTC_WRAPPER +
        # SCCACHE_* → the in-cluster MinIO; see indy/arc-runner/sccache-minio
        # + values-*.yaml). It shares rustc artifacts across successive
        # pushes to a PR. `|| true` keeps a missing/unconfigured sccache
        # from failing the job.
        if: always() && steps.rust.outputs.changed == 'true'
        run: sccache --show-stats || true

name: Rust tests

on:
  # Run once per change: push events only fire for main (post-merge
  # validation); feature-branch pushes that have an open PR fire via
  # the pull_request `synchronize` event instead. Without the branch
  # filter every PR update would trigger two duplicate runs.
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Drop debuginfo entirely in CI. `[profile.dev] debug = "line-tables-only"`
  # (workspace Cargo.toml) is already a 5-10x cut over full DWARF, but this
  # workspace links ~500 test binaries (api-server alone has 206 test files,
  # each a separate binary statically linking the whole graph), so even
  # line-tables ends up at 69 GiB of target/ — 65.5 GiB of it test binaries.
  # The arc-runner-set node has ~85 GiB allocatable and kubelet holds back a
  # ~14.5 GiB nodefs eviction threshold, leaving a real ceiling near 65 GiB,
  # so builds were evicted mid-nextest ("low on resource: ephemeral-storage
  # ... Container runner was using 69066692Ki"), surfacing as an opaque
  # exit-130 cancel with the runner's logs never uploaded.
  #
  # Measured on this workspace: 69G -> 29G target/ (test binaries 65.5 ->
  # 26.9 GiB), which puts a full run at well under half the ceiling.
  #
  # Set at workflow level, NOT per-step, on purpose: clippy and nextest must
  # agree on the profile. If they disagreed, cargo would rebuild the whole
  # graph for the second step and keep BOTH artifact sets on disk — the very
  # thing we are avoiding.
  #
  # Trade-off: CI panic backtraces keep symbol names but lose file:line. To
  # get lines back when diagnosing a CI-only failure, temporarily set this to
  # `line-tables-only`, or reproduce locally where the profile still applies.
  CARGO_PROFILE_DEV_DEBUG: "0"


# Three jobs. `clippy` and `nextest` are independent and run in PARALLEL, so
# the wall clock of a PR is max(clippy, nextest) instead of their sum (they
# used to be one serial job: clippy first, then the test build + run). Each
# keeps its own `target/` cache: clippy only produces check metadata, the
# nextest build only produces codegen artifacts, so there was no artifact
# reuse between the two steps to lose; only the cheap build scripts and proc
# macros are compiled twice.
#
# `checks` is the single REQUIRED status check for Rust and keeps its old
# name and id, so branch protection is unchanged. It is a pure aggregate gate
# over the two jobs above. When a PR touches no Rust, both jobs still start,
# skip their cache + build steps via the change-detection step and report
# green in seconds. Pushes to main always run the full jobs.
#
# Both feature configs are still compiled exactly once, preserving the
# original dual-config coverage:
#   - clippy runs with DEFAULT features, the no-sqlite build guard + lint.
#   - nextest runs WITH the `sqlite` feature. Features are additive and
#     there are no `cfg(not(feature="sqlite"))` tests, so this is a superset
#     of the default run (regular tests PLUS the rhino/SQLite-gated ones).
jobs:
  clippy:
    name: cargo clippy
    runs-on: arc-runner-set
    steps:
      - name: Checkout repository
        # rhino is an in-tree submodule (./rhino) resolving the storage crate's
        # `../../rhino` path dep. submodules: recursive checks it out pinned.
        # fetch-depth: 0 gives the change-detection diff the PR base commit.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Detect Rust-relevant changes
        id: rust
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
              | grep -qE '(\.rs|\.proto)$|(^|/)Cargo\.(toml|lock)$|(^|/)build\.rs$|^rhino($|/)|(^|/)rust-toolchain|^\.github/workflows/(test|fmt)\.yml$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Rust-relevant changes — skipping clippy (the required check reports green)."
          fi

      - name: Cache cargo registry + target
        # rust-cache restores ~/.cargo and target/ from the GitHub Actions
        # cache scoped to Cargo.lock + rustc version. `save-if: main only`:
        # PRs restore the cache main wrote on the most recent merge and skip
        # the upload at job end. Own shared-key: this job's target/ holds
        # check metadata only.
        if: steps.rust.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          shared-key: "checks-clippy"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy (hard gate, all targets)
        # `-- -D warnings` converts every clippy lint into a build error
        # so warnings cannot accrete unnoticed. Future PRs must keep clippy
        # green or `#[allow(<lint>)]` the specific case with a comment.
        #
        # Default features only: this is the no-sqlite build guard (the
        # nextest job compiles the sqlite config), and the optional
        # `jaeger` feature pulls in opentelemetry-jaeger which is itself
        # deprecated upstream. clippy lints are therefore not run on the
        # `cfg(feature = "sqlite")` code paths; those are still compiled
        # (and type-checked) by the sqlite-enabled nextest job, just not
        # linted.
        #
        # `--all-targets` also acts as the bin-target build check: clippy
        # compiles every target before lint, so any compile error in a bin
        # fails this step.
        if: steps.rust.outputs.changed == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  nextest:
    name: cargo nextest
    runs-on: arc-runner-set
    steps:
      - name: Checkout repository
        # rhino is an in-tree submodule (./rhino) resolving the storage crate's
        # `../../rhino` path dep. submodules: recursive checks it out pinned.
        # fetch-depth: 0 gives the change-detection diff the PR base commit.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Detect Rust-relevant changes
        id: rust
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
              | grep -qE '(\.rs|\.proto)$|(^|/)Cargo\.(toml|lock)$|(^|/)build\.rs$|^rhino($|/)|(^|/)rust-toolchain|^\.github/workflows/(test|fmt)\.yml$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Rust-relevant changes — skipping nextest (the required check reports green)."
          fi

      - name: Cache cargo registry + target
        # Same cache policy as the clippy job, own shared-key: this job's
        # target/ holds the sqlite-feature test build.
        if: steps.rust.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"
          shared-key: "checks-nextest"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo nextest run
        # Runs the whole workspace with the `sqlite` feature ON (a superset of
        # the default run, see the header comment).
        #
        # `--status-level fail` suppresses per-test PASS lines; the final
        # summary still reports totals. `--no-fail-fast` surfaces every failure
        # in one run instead of stopping at the first. Doctests are not run
        # (nextest limitation); none of the workspace depends on doctest
        # coverage; add a separate `cargo test --doc` step if that changes.
        if: steps.rust.outputs.changed == 'true'
        run: cargo nextest run --workspace --features rusternetes-api-server/sqlite --locked --no-fail-fast --status-level fail

      - name: Wire-format coverage report (warnings only)
        # Passing nextest tests hide their output, so the gaps (protobuf
        # registry vs the bundled upstream generated.proto snapshots, and a
        # per-served-resource protobuf / OpenAPI v2 / v3 check) are surfaced
        # as ::warning annotations plus a full table in the job summary.
        # Re-runs the one report test from the binary the previous step
        # already compiled (same --workspace + feature set => no rebuild).
        # NEVER fails the job on a gap: the script exits 0 unless the harness
        # itself breaks (discovery unreachable, proto unparseable).
        if: steps.rust.outputs.changed == 'true'
        run: bash scripts/wire-format-coverage.sh

      - name: sccache stats
        # Compilation cache hit-rate, for visibility. `|| true` keeps a
        # missing/unconfigured sccache from failing the job.
        if: always() && steps.rust.outputs.changed == 'true'
        run: sccache --show-stats || true

  checks:
    # Aggregate required check. Keep this name and job id: branch protection
    # matches on it.
    name: cargo clippy + nextest
    needs: [clippy, nextest]
    if: always()
    runs-on: arc-runner-set-small
    steps:
      - name: Require clippy and nextest
        run: |
          echo "clippy:  ${{ needs.clippy.result }}"
          echo "nextest: ${{ needs.nextest.result }}"
          [ "${{ needs.clippy.result }}" = "success" ] && [ "${{ needs.nextest.result }}" = "success" ]

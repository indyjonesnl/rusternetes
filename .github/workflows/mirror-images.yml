name: Mirror e2e images

# Copy the pinned registry.k8s.io images CI depends on (ci/mirror/images.txt) to
# ghcr.io/indyjonesnl/rusternetes/mirror/<path>. Conformance runs use the
# copies explicitly (scripts/conformance-target-run.sh, ci/mirror/e2e-repo-list.yaml)
# and fall back to registry.k8s.io when the mirror is incomplete. Tags are pinned and
# the copy is a registry-to-registry manifest-list copy, so mirror digests equal
# upstream digests. Re-running is a no-op for images already up to date.
#
# One-time: each new package under .../k3rs/mirror/* must be set to
# public in the GitHub package settings so containerd can pull anonymously.

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/mirror/images.txt'
      - 'scripts/mirror-images.sh'
      - '.github/workflows/mirror-images.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: mirror-images
  cancel-in-progress: false

env:
  BUILDKIT_PROGRESS: plain

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
      - name: Check list against the conformance image's e2e image list
        run: scripts/check-mirror-images.sh --list-images
      - name: Mirror images
        run: scripts/mirror-images.sh | tee "$RUNNER_TEMP/mirror.log"
      - name: Summary
        if: always()
        run: |
          {
            echo '### Mirrored images (path, source digest)'
            echo '```'
            grep -E '^(ok|copy) ' "$RUNNER_TEMP/mirror.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

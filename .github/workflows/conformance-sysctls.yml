name: conformance-sysctls

# Independent per-target conformance run. Full runs fire nightly (refreshing the
# sysctls badge against the latest main image); workflow_dispatch with a `focus`
# runs one named test to prove a PR (that focused run does NOT touch the badge).
# All logic lives in the reusable .github/workflows/conformance-target.yml engine.
on:
  schedule:
    - cron: '54 2 * * *'
  workflow_dispatch:
    inputs:
      focus:
        description: "Ginkgo --focus override (narrow to one test to prove a PR). Empty = full target run."
        required: false
        default: ''
      image-tag:
        description: "GHCR image tag to test (default main). Empty = build locally."
        required: false
        default: main

# Per-target group so a newer run supersedes an older one for THIS target
# without cancelling other targets' runs (independence: FR-003).
concurrency:
  group: conformance-sysctls
  cancel-in-progress: true

jobs:
  run:
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/conformance-target.yml
    with:
      target: sysctls
      focus: ${{ github.event.inputs.focus || '' }}
      # NOT `inputs.image-tag || 'main'`: an empty string is falsy in GitHub
      # expressions, so an explicit `-f image-tag=''` collapsed back to 'main'
      # and the run silently tested the published image instead of the branch
      # under review. That made the documented "Empty = build locally" (honoured
      # by conformance-target.yml and ci/actions/bring-up-cluster) unreachable
      # from every per-target workflow, so no PR could be proven before merge.
      # `== null` distinguishes "input omitted" (scheduled run -> default main)
      # from "explicitly empty" (build the branch).
      image-tag: ${{ github.event.inputs.image-tag == null && 'main' || github.event.inputs.image-tag }}

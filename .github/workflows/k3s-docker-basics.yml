name: k3s-docker-basics

# Port of the k3s Docker "basics" functional test: tests/docker/basics/basics_test.go
# (Test_DockerBasic). Brings the multi-node SQLite stack up through the shared
# `bring-up-cluster` action (node-1 = server, node-2 = agent) and runs
# scripts/k3s-tests/docker-basics.sh, which prints one
# `[k3s-docker-basics] spec="..." result=PASS|FAIL` line per spec.
# A failing spec fails the job, as it does in k3s.

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: "GHCR image tag to test, or 'local' to build this ref from source (use 'local' to prove a PR)."
        required: false
        default: local

concurrency:
  group: k3s-docker-basics-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_HOST: unix:///var/run/docker.sock

jobs:
  basics:
    runs-on: arc-runner-set-conformance
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `local` -> empty image-tag, which tells the bring-up action to compile
      # this ref (same shell-side normalization as conformance-target.yml).
      - name: Resolve image tag
        id: tag
        env:
          REQUESTED: ${{ inputs.image-tag }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" = "local" ] || [ -z "$REQUESTED" ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
          else
            echo "value=$REQUESTED" >> "$GITHUB_OUTPUT"
          fi

      - name: Bring up cluster
        uses: ./ci/actions/bring-up-cluster
        with:
          image-tag: ${{ steps.tag.outputs.value }}

      - name: Run k3s docker basics suite
        run: |
          set -o pipefail
          bash scripts/k3s-tests/docker-basics.sh 2>&1 | tee k3s-docker-basics.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k3s-docker-basics
          path: k3s-docker-basics.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down cluster
        if: always()
        run: |
          docker compose -f compose.sqlite.yml logs --tail=100 || true
          docker compose -f compose.sqlite.yml down -v || true

name: Check upstream feature-gate table

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/feature-gate-table.yml'
      - 'scripts/gen-feature-gate-table.sh'
      - 'scripts/gen_feature_gate_table.py'
      - 'scripts/feature-gate/**'
      - 'scripts/feature-gates/**'
      - 'crates/common/src/feature_gates/**'

permissions:
  contents: read

concurrency:
  group: feature-gate-table-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verify table against Kubernetes release-1.35
    # ARC images intentionally omit Go; use the hosted tooling runner, as
    # actionlint.yml does, rather than installing packages on an ARC runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: rusternetes
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: rusternetes
          persist-credentials: false

      - name: Check required tools
        run: |
          for tool in go python3 rustfmt git diff; do
            command -v "$tool" >/dev/null || { echo "::error::$tool not found on runner"; exit 1; }
          done
          go version
          python3 --version
          rustfmt --version

      - name: Checkout Kubernetes release-1.35
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: kubernetes/kubernetes
          ref: release-1.35
          fetch-depth: 1
          path: kubernetes
          persist-credentials: false

      - name: Check generated table for drift
        # Sibling checkouts match the script's default ../kubernetes path.
        # --check emits a unified diff and exits nonzero when the table differs.
        run: bash scripts/gen-feature-gate-table.sh --check

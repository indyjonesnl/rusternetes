      image-tag:
        description: "GHCR image tag to test (default main). Empty = build locally."
        required: false
        default: main

# Per-SIG group so a newer run supersedes an older one for THIS sig without
# cancelling other SIGs' runs (independence: FR-003).
concurrency:
  group: conformance-sig-instrumentation
  cancel-in-progress: true

jobs:
  run:
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/conformance-sig.yml
    with:
      sig: sig-instrumentation
      focus: ${{ github.event.inputs.focus || '' }}
      image-tag: ${{ github.event.inputs.image-tag || 'main' }}

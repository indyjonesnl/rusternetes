name: conformance-sig-instrumentation

# Independent per-SIG conformance run. Full runs fire nightly (refreshing the
# sig-instrumentation badge against the latest main image); workflow_dispatch with a `focus`
# runs one named test to prove a PR (that focused run does NOT touch the badge).
# All logic lives in the reusable .github/workflows/conformance-sig.yml engine.

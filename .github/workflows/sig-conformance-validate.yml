name: SIG conformance validate

# Cheap PR guard for the per-SIG conformance scaffolding: manifest validity,
# runner unit tests, generated-workflow drift, and SIG coverage (against the
# committed sample fixture — full-set coverage is proven by the per-SIG
# conformance runs themselves, which use the real conformance image).
#
# No cluster, no image pull — plain bash + jq on ubuntu-latest.

on:
  pull_request:
    paths:
      - 'ci/conformance/sigs.json'
      - 'scripts/conformance-sig-run.sh'
      - 'scripts/conformance-sigs-discover.sh'
      - 'scripts/gen-sig-workflows.sh'
      - 'scripts/tests/test-sigs-manifest.sh'
      - 'scripts/tests/test-conformance-sig-run.sh'
      - 'scripts/tests/test-sig-workflows-sync.sh'
      - 'scripts/tests/test-sig-coverage.sh'
      - 'scripts/tests/testdata/sig-coverage-sample.txt'
      - '.github/workflows/conformance-sig.yml'
      - '.github/workflows/conformance-sig-*.yml'
      - '.github/workflows/sig-conformance-validate.yml'
  workflow_dispatch: {}

jobs:
  validate:
    name: manifest + unit tests + drift + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: command -v jq >/dev/null || (sudo apt-get update && sudo apt-get install -y jq)
      - name: Manifest validity
        run: bash scripts/tests/test-sigs-manifest.sh
      - name: Runner unit tests
        run: bash scripts/tests/test-conformance-sig-run.sh
      - name: Per-SIG workflow drift
        run: bash scripts/tests/test-sig-workflows-sync.sh
      - name: SIG coverage (sample fixture)
        run: bash scripts/tests/test-sig-coverage.sh

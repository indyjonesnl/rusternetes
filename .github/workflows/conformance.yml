name: Conformance (Hydrophone)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test scope (ci | full)'
        required: false
        default: 'full'
      focus:
        description: 'Ginkgo focus regex override'
        required: false
        default: ''
      skip:
        description: 'Ginkgo skip regex override'
        required: false
        default: ''
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC
  pull_request:
    # Self-hosted runner so PR triggers are free of GH-minute cost.
    # Limit to changes that can actually affect the conformance run.
    paths:
      - '.github/workflows/conformance.yml'
      - 'scripts/run-ci-conformance.sh'
      - 'scripts/bootstrap-cluster.sh'
      - 'scripts/generate-certs.sh'
      - 'compose.sqlite.yml'
      - 'compose.yml'
      - 'Dockerfile.*'
      - 'crates/**'
      - 'Cargo.lock'
      - 'Cargo.toml'

jobs:
  conformance:
    runs-on: self-hosted
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Verify required tools on runner
        run: |
          # Self-hosted runner prerequisites. No sudo / no apt install is
          # performed here — install these once on the runner host.
          missing=()
          for tool in docker curl tar python3 kubectl openssl jq; do
            command -v "$tool" >/dev/null || missing+=("$tool")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            cat >&2 <<EOF
          Missing tools on runner: ${missing[*]}

          This workflow runs on a self-hosted runner and does not install its
          own dependencies. Install the missing packages on the runner host
          (Debian/Ubuntu): docker, curl, tar, python3, kubectl, openssl, jq.
          Verify with: command -v docker kubectl openssl jq python3
          EOF
            exit 1
          fi
          docker --version
          docker compose version >/dev/null || { echo "docker compose v2 plugin required" >&2; exit 1; }

      - name: Set KUBELET_VOLUMES_PATH
        run: echo "KUBELET_VOLUMES_PATH=$GITHUB_WORKSPACE/.rusternetes/volumes" >> "$GITHUB_ENV"

      - name: Build cluster images
        run: docker compose -f compose.sqlite.yml build

      - name: Run conformance
        env:
          # Default to MODE=full so every trigger (PR sync, weekly cron,
          # manual without input) produces the full ~441-test certified
          # picture. Override via the workflow_dispatch `mode` input
          # (e.g. `mode: ci`) for a focused fast run.
          MODE: ${{ github.event.inputs.mode || 'full' }}
          FOCUS: ${{ github.event.inputs.focus }}
          SKIP: ${{ github.event.inputs.skip }}
        run: bash scripts/run-ci-conformance.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: conformance-results/

      - name: Tear down cluster
        if: always()
        run: docker compose -f compose.sqlite.yml down -v || true

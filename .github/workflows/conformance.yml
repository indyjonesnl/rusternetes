name: Conformance (Hydrophone)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test scope (ci | full)'
        required: false
        default: 'ci'
      focus:
        description: 'Ginkgo focus regex override'
        required: false
        default: ''
      skip:
        description: 'Ginkgo skip regex override'
        required: false
        default: ''
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC

jobs:
  conformance:
    runs-on: self-hosted
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Verify required tools on runner
        run: |
          # Self-hosted runner prerequisites. No sudo / no apt install is
          # performed here — install these once on the runner host.
          missing=()
          for tool in podman curl tar python3 kubectl openssl jq; do
            command -v "$tool" >/dev/null || missing+=("$tool")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            cat >&2 <<EOF
          Missing tools on runner: ${missing[*]}

          This workflow runs on a self-hosted runner and does not install its
          own dependencies. Install the missing packages on the runner host
          (Debian/Ubuntu): podman, curl, tar, python3, kubectl, openssl, jq.
          Verify with: command -v podman kubectl openssl jq python3
          EOF
            exit 1
          fi
          podman --version
          if ! podman compose version >/dev/null 2>&1; then
            command -v podman-compose >/dev/null || { echo "podman compose v2 or podman-compose required" >&2; exit 1; }
            podman-compose --version
          fi

      - name: Set KUBELET_VOLUMES_PATH
        run: echo "KUBELET_VOLUMES_PATH=$GITHUB_WORKSPACE/.rusternetes/volumes" >> "$GITHUB_ENV"

      - name: Build cluster images
        run: podman compose -f compose.sqlite.yml build

      - name: Run conformance
        env:
          MODE: ${{ github.event.inputs.mode || 'ci' }}
          FOCUS: ${{ github.event.inputs.focus }}
          SKIP: ${{ github.event.inputs.skip }}
        run: bash scripts/run-ci-conformance.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: conformance-results/

      - name: Tear down cluster
        if: always()
        run: podman compose -f compose.sqlite.yml down -v || true

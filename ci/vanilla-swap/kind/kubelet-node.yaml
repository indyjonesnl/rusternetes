# Join-worker swap recipe: add ONE extra node running the rusternetes kubelet,
# attached to the otherwise-vanilla kind control plane.
#
# ⚠️ BLOCKED by rusternetes bug #1638: the kubelet registers its Node against a
# vanilla api-server and briefly reports Ready, then crashes on the first HTTP
# 409 Conflict during node status-update (no optimistic-concurrency retry). Until
# that is fixed the node flaps Ready->NotReady and readiness cannot be met. The
# swap MECHANISM below is validated up to successful node registration.
#
# Consumed by vs_swap_join_worker() in scripts/vanilla-swap-common.sh, which runs
# the rusternetes kubelet + containerd as CONTAINERS on the kind docker network
# (NOT the kubelet binary on a kind node: the binary needs GLIBC 2.38/2.39 and a
# stock kind node ships 2.36, so it must run from its image with the correct
# glibc). Steps:
#   1. start rusternetes/containerd (CRI + CNI) sharing a /run/containerd volume;
#   2. copy the control-plane admin.conf into a file the kubelet mounts
#      (client-cert auth; the kubelet prefers the kubeconfig's cluster.server);
#   3. start the rusternetes/kubelet image in API mode pointed at the CRI socket
#      and the vanilla api-server; it self-registers the Node.
#
# The CRI runtime (rusternetes/containerd) is INFRASTRUCTURE, not a module under
# test, so the post-swap guard excludes */containerd images from its
# "exactly one rusternetes module" count.
nodeName: rusternetes-node
criImageRepoSuffix: containerd          # sibling of the kubelet imageRepo: .../rusternetes/containerd
criSocket: unix:///run/containerd/containerd.sock
clusterDns: "10.96.0.10"
# Standard interfaces only (CRI/CNI) — no rusternetes-private coupling.

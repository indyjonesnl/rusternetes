// Node-service subset of the Container Storage Interface (CSI) v1 protocol.
//
// Source of truth: the CSI spec repository (container-storage-interface/spec),
// csi.proto, package `csi.v1`. The message and service names, field numbers and
// enum values below are copied from that definition and were checked against
// the generated Go bindings Kubernetes v1.35 vendors
// (`vendor/<spec repo>/lib/go/csi/csi.pb.go`). Protobuf is wire-compatible on
// field numbers, so every conformant CSI driver interoperates unmodified.
//
// DEVIATION: this is a SUBSET, not a verbatim copy. The upstream spec repo is
// not available on this machine (only its generated Go code is, under the
// kubernetes vendor tree), so the file is reconstructed from those bindings and
// holds exactly the Node-service RPCs the kubelet's volume plugin calls
// (`pkg/volume/csi/csi_client.go`), plus the Identity.GetPluginCapabilities and
// Controller (CreateVolume/DeleteVolume/ControllerGetCapabilities/
// CreateSnapshot/DeleteSnapshot) RPCs of the external-provisioner client. The `csi_secret` field option is omitted: it
// only drives log redaction in Go's `protosanitizer` and has no wire effect.
// Replace with the verbatim file when the spec repo is vendored.

syntax = "proto3";
package csi.v1;

import "google/protobuf/timestamp.proto";

service Identity {
  rpc GetPluginCapabilities (GetPluginCapabilitiesRequest) returns (GetPluginCapabilitiesResponse) {}
}

service Controller {
  rpc CreateVolume (CreateVolumeRequest) returns (CreateVolumeResponse) {}
  rpc DeleteVolume (DeleteVolumeRequest) returns (DeleteVolumeResponse) {}
  rpc ControllerPublishVolume (ControllerPublishVolumeRequest) returns (ControllerPublishVolumeResponse) {}
  rpc ControllerUnpublishVolume (ControllerUnpublishVolumeRequest) returns (ControllerUnpublishVolumeResponse) {}
  rpc ControllerGetCapabilities (ControllerGetCapabilitiesRequest) returns (ControllerGetCapabilitiesResponse) {}
  rpc CreateSnapshot (CreateSnapshotRequest) returns (CreateSnapshotResponse) {}
  rpc DeleteSnapshot (DeleteSnapshotRequest) returns (DeleteSnapshotResponse) {}
}

service Node {
  rpc NodeStageVolume (NodeStageVolumeRequest) returns (NodeStageVolumeResponse) {}
  rpc NodeUnstageVolume (NodeUnstageVolumeRequest) returns (NodeUnstageVolumeResponse) {}
  rpc NodePublishVolume (NodePublishVolumeRequest) returns (NodePublishVolumeResponse) {}
  rpc NodeUnpublishVolume (NodeUnpublishVolumeRequest) returns (NodeUnpublishVolumeResponse) {}
  rpc NodeGetCapabilities (NodeGetCapabilitiesRequest) returns (NodeGetCapabilitiesResponse) {}
  rpc NodeExpandVolume (NodeExpandVolumeRequest) returns (NodeExpandVolumeResponse) {}
  rpc NodeGetInfo (NodeGetInfoRequest) returns (NodeGetInfoResponse) {}
}

message VolumeCapability {
  // Indicate that the volume will be accessed via the block device API.
  message BlockVolume {}

  // Indicate that the volume will be accessed via the filesystem API.
  message MountVolume {
    string fs_type = 1;
    repeated string mount_flags = 2;
    // If SP has VOLUME_MOUNT_GROUP node capability and CO provides this field
    // then SP MUST ensure that the volume_mount_group parameter is passed as
    // the group identifier to the underlying operating system mount system call.
    string volume_mount_group = 3;
  }

  // Specify how a volume can be accessed.
  message AccessMode {
    enum Mode {
      UNKNOWN = 0;
      SINGLE_NODE_WRITER = 1;
      SINGLE_NODE_READER_ONLY = 2;
      MULTI_NODE_READER_ONLY = 3;
      MULTI_NODE_SINGLE_WRITER = 4;
      MULTI_NODE_MULTI_WRITER = 5;
      SINGLE_NODE_SINGLE_WRITER = 6;
      SINGLE_NODE_MULTI_WRITER = 7;
    }
    Mode mode = 1;
  }

  // Specifies what API the volume will be accessed using. One of the following
  // fields MUST be specified.
  oneof access_type {
    BlockVolume block = 1;
    MountVolume mount = 2;
  }

  AccessMode access_mode = 3;
}

message NodeStageVolumeRequest {
  string volume_id = 1;
  map<string, string> publish_context = 2;
  string staging_target_path = 3;
  VolumeCapability volume_capability = 4;
  map<string, string> secrets = 5;
  map<string, string> volume_context = 6;
}

message NodeStageVolumeResponse {}

message NodeUnstageVolumeRequest {
  string volume_id = 1;
  string staging_target_path = 2;
}

message NodeUnstageVolumeResponse {}

message NodePublishVolumeRequest {
  string volume_id = 1;
  map<string, string> publish_context = 2;
  string staging_target_path = 3;
  string target_path = 4;
  VolumeCapability volume_capability = 5;
  bool readonly = 6;
  map<string, string> secrets = 7;
  map<string, string> volume_context = 8;
}

message NodePublishVolumeResponse {}

message NodeUnpublishVolumeRequest {
  string volume_id = 1;
  string target_path = 2;
}

message NodeUnpublishVolumeResponse {}

message NodeGetInfoRequest {}

message NodeGetInfoResponse {
  string node_id = 1;
  int64 max_volumes_per_node = 2;
  Topology accessible_topology = 3;
}

message Topology {
  map<string, string> segments = 1;
}

message NodeGetCapabilitiesRequest {}

message NodeGetCapabilitiesResponse {
  repeated NodeServiceCapability capabilities = 1;
}

message NodeServiceCapability {
  message RPC {
    enum Type {
      UNKNOWN = 0;
      STAGE_UNSTAGE_VOLUME = 1;
      GET_VOLUME_STATS = 2;
      EXPAND_VOLUME = 3;
      VOLUME_CONDITION = 4;
      SINGLE_NODE_MULTI_WRITER = 5;
      VOLUME_MOUNT_GROUP = 6;
    }
    Type type = 1;
  }

  oneof type {
    RPC rpc = 1;
  }
}

message CapacityRange {
  int64 required_bytes = 1;
  int64 limit_bytes = 2;
}

message NodeExpandVolumeRequest {
  string volume_id = 1;
  string volume_path = 2;
  CapacityRange capacity_range = 3;
  string staging_target_path = 4;
  VolumeCapability volume_capability = 5;
  map<string, string> secrets = 6;
}

message NodeExpandVolumeResponse {
  int64 capacity_bytes = 1;
}

// ---- Identity + Controller service subset (external-provisioner / snapshotter
// client side). Field numbers verified against the vendored csi.pb.go.

message GetPluginCapabilitiesRequest {}

message GetPluginCapabilitiesResponse {
  repeated PluginCapability capabilities = 1;
}

message PluginCapability {
  message Service {
    enum Type {
      UNKNOWN = 0;
      CONTROLLER_SERVICE = 1;
      VOLUME_ACCESSIBILITY_CONSTRAINTS = 2;
      GROUP_CONTROLLER_SERVICE = 3;
    }
    Type type = 1;
  }
  message VolumeExpansion {
    enum Type {
      UNKNOWN = 0;
      ONLINE = 1;
      OFFLINE = 2;
    }
    Type type = 1;
  }
  oneof type {
    Service service = 1;
    VolumeExpansion volume_expansion = 2;
  }
}

message ControllerGetCapabilitiesRequest {}

message ControllerGetCapabilitiesResponse {
  repeated ControllerServiceCapability capabilities = 1;
}

message ControllerServiceCapability {
  message RPC {
    enum Type {
      UNKNOWN = 0;
      CREATE_DELETE_VOLUME = 1;
      PUBLISH_UNPUBLISH_VOLUME = 2;
      LIST_VOLUMES = 3;
      GET_CAPACITY = 4;
      CREATE_DELETE_SNAPSHOT = 5;
      LIST_SNAPSHOTS = 6;
      CLONE_VOLUME = 7;
      PUBLISH_READONLY = 8;
      EXPAND_VOLUME = 9;
      LIST_VOLUMES_PUBLISHED_NODES = 10;
      VOLUME_CONDITION = 11;
      GET_VOLUME = 12;
      SINGLE_NODE_MULTI_WRITER = 13;
      MODIFY_VOLUME = 14;
    }
    Type type = 1;
  }
  oneof type {
    RPC rpc = 1;
  }
}

message TopologyRequirement {
  repeated Topology requisite = 1;
  repeated Topology preferred = 2;
}

message VolumeContentSource {
  message SnapshotSource {
    string snapshot_id = 1;
  }
  message VolumeSource {
    string volume_id = 1;
  }
  oneof type {
    SnapshotSource snapshot = 1;
    VolumeSource volume = 2;
  }
}

message Volume {
  int64 capacity_bytes = 1;
  string volume_id = 2;
  map<string, string> volume_context = 3;
  VolumeContentSource content_source = 4;
  repeated Topology accessible_topology = 5;
}

message CreateVolumeRequest {
  string name = 1;
  CapacityRange capacity_range = 2;
  repeated VolumeCapability volume_capabilities = 3;
  map<string, string> parameters = 4;
  map<string, string> secrets = 5;
  VolumeContentSource volume_content_source = 6;
  TopologyRequirement accessibility_requirements = 7;
  map<string, string> mutable_parameters = 8;
}

message CreateVolumeResponse {
  Volume volume = 1;
}

message DeleteVolumeRequest {
  string volume_id = 1;
  map<string, string> secrets = 2;
}

message DeleteVolumeResponse {}

// CSI spec v1.x field numbers (container-storage-interface/spec csi.proto).
message ControllerPublishVolumeRequest {
  string volume_id = 1;
  string node_id = 2;
  VolumeCapability volume_capability = 3;
  bool readonly = 4;
  map<string, string> secrets = 5;
  map<string, string> volume_context = 6;
}

message ControllerPublishVolumeResponse {
  map<string, string> publish_context = 1;
}

message ControllerUnpublishVolumeRequest {
  string volume_id = 1;
  string node_id = 2;
  map<string, string> secrets = 3;
}

message ControllerUnpublishVolumeResponse {}

message CreateSnapshotRequest {
  string source_volume_id = 1;
  string name = 2;
  map<string, string> secrets = 3;
  map<string, string> parameters = 4;
}

message CreateSnapshotResponse {
  Snapshot snapshot = 1;
}

message Snapshot {
  int64 size_bytes = 1;
  string snapshot_id = 2;
  string source_volume_id = 3;
  google.protobuf.Timestamp creation_time = 4;
  bool ready_to_use = 5;
}

message DeleteSnapshotRequest {
  string snapshot_id = 1;
  map<string, string> secrets = 2;
}

message DeleteSnapshotResponse {}

[package]
name = "k3rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "All-in-one Kubernetes in a single binary"

[[bin]]
name = "k3rs"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = [
    "k3rs-storage/sqlite",
    "k3rs-api-server/sqlite",
    "k3rs-scheduler/sqlite",
    "k3rs-controller-manager/sqlite",
    "k3rs-kubelet/sqlite",
    "k3rs-kube-proxy/sqlite",
    "k3rs-dns/sqlite",
]
redis = [
    "k3rs-storage/redis",
    "k3rs-api-server/redis",
    "k3rs-scheduler/redis",
    "k3rs-controller-manager/redis",
    "k3rs-kubelet/redis",
    "k3rs-kube-proxy/redis",
    "k3rs-dns/redis",
]
# Heap profiling via dhat (off by default). Build with
# `--features dhat-heap` to swap in dhat's allocator; on a clean shutdown
# (SIGINT) it writes `dhat-heap.json` with per-backtrace allocation sizes,
# used to attribute the all-in-one's idle RAM (#1138). Pure Rust — no jeprof.
dhat-heap = ["dep:dhat"]
# Link mimalloc as the global allocator (off by default). Critical for the musl
# static builds: musl's default allocator is ~10x slower under multi-threaded
# lock contention, which would regress the all-in-one's throughput; mimalloc
# also tends to lower idle RSS (the footprint north-star, #1041). Mutually
# exclusive with `dhat-heap` — only one #[global_allocator] per binary; dhat
# wins when both are set so heap profiling still works.
mimalloc = ["dep:mimalloc"]

[dependencies]
k3rs-api-server = { path = "../api-server" }
k3rs-scheduler = { path = "../scheduler" }
k3rs-controller-manager = { path = "../controller-manager" }
k3rs-kubelet = { path = "../kubelet" }
k3rs-kube-proxy = { path = "../kube-proxy" }
k3rs-dns = { path = "../dns" }
k3rs-client = { path = "../client" }
k3rs-storage = { path = "../storage" }
k3rs-common = { path = "../common" }
tokio.workspace = true
axum.workspace = true
clap.workspace = true
tracing.workspace = true
anyhow.workspace = true
dhat = { version = "0.3", optional = true }
mimalloc = { version = "0.1", optional = true }

[dev-dependencies]
serial_test = { workspace = true }

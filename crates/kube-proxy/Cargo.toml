[package]
name = "rusternetes-kube-proxy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "rusternetes_kube_proxy"
path = "src/lib.rs"

[[bin]]
name = "kube-proxy"
path = "src/main.rs"

[features]
mimalloc = ["dep:mimalloc"]
default = []
sqlite = ["rusternetes-storage/sqlite"]
redis = ["rusternetes-storage/redis"]

[dependencies]
mimalloc = { version = "0.1", optional = true }
rusternetes-common = { path = "../common", features = ["axum-support", "clap-support"] }
# api-client: StorageBackend::Api + the shared ApiStorage adapter (now lives in
# the storage crate; resolves the old controller-manager dependency, #1146).
rusternetes-storage = { path = "../storage", features = ["api-client"] }
rusternetes-client = { path = "../client" }
tokio.workspace = true
axum.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
chrono.workspace = true
prometheus.workspace = true
# Existing locked dependencies, for upstream promhttp negotiation/exposition.
protobuf = "3.7"
url = "2.5"
miniz_oxide = "0.8"
crc = "3.4"
futures = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
serial_test = { workspace = true }
# Integration tests drive the Endpoints/EndpointSlice controllers to populate
# state kube-proxy then programs. (The lib no longer depends on it — ApiStorage
# now lives in the storage crate.)
rusternetes-controller-manager = { path = "../controller-manager" }

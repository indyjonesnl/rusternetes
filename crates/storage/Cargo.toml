[package]
name = "k3rs-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
# Unit tests live in tests/it: a second compilation of the lib as a test
# target costs as much as the lib itself.
test = false

[features]
default = []
sqlite = ["dep:rhino", "rhino/sqlite"]
redis = ["dep:rhino", "rhino/redis"]
# Enables the StorageBackend::Api variant + ApiStorage adapter (Storage trait
# over the api-server REST client). Opt-in so the default storage build (and
# leaf consumers like the api-server) stay lean. Components running as
# api-server clients (kubelet/controller-manager/kube-proxy, the all-in-one)
# enable it via `k3rs-storage/api-client`.
api-client = ["dep:k3rs-client"]

[dependencies]
k3rs-common = { path = "../common" }
k3rs-client = { path = "../client", optional = true }
# Pinned by commit; Cargo.lock holds the same rev. Bump both this and
# `ARG RHINO_REV` in rhino.Dockerfile together (scripts/check-rhino-rev.sh
# guards the pair). To hack on rhino locally, add an uncommitted
# `[patch."https://github.com/indyjonesnl/rhino.git"]` pointing at a checkout.
rhino = { git = "https://github.com/indyjonesnl/rhino.git", rev = "5e07b3ca7d2b04456891d40f6a83e4e10cbcd075", optional = true, default-features = false }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
etcd-client.workspace = true
# gRPC status codes, to detect etcd's compaction error by code rather than by
# matching on the message text. Same tonic release etcd-client links.
tonic.workspace = true
async-trait.workspace = true
async-stream.workspace = true
tracing.workspace = true
futures.workspace = true
uuid.workspace = true
chrono.workspace = true
prometheus.workspace = true

[dev-dependencies]
# `testcontainers` spins up real etcd via Docker so the etcd backend tests
# exercise the live wire protocol instead of being permanently `#[ignore]`d.
# Requires Docker (or Podman with the Docker-compat socket) on the host;
# CI / dev environments already have Docker available.
testcontainers = "0.23"
criterion = "0.5"
tempfile = "3.27.0"
# Holds a real SQLite write lock from a second connection in the
# busy-contention test (#3877); same sqlx rhino links.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

[[bench]]
name = "watch_latency"
harness = false

[package]
name = "rusternetes-kubelet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "kubelet"
path = "src/main.rs"

[lib]
name = "rusternetes_kubelet"
path = "src/lib.rs"

[features]
mimalloc = ["dep:mimalloc"]
default = []
sqlite = ["rusternetes-storage/sqlite"]
redis = ["rusternetes-storage/redis"]

[dependencies]
mimalloc = { version = "0.1", optional = true }
rusternetes-common = { path = "../common" }
# api-client: StorageBackend::Api lets the in-cluster kubelet read/write via
# the api-server while keeping its Arc<StorageBackend> handle unchanged.
rusternetes-storage = { path = "../storage", features = ["api-client"] }
rusternetes-client = { path = "../client" }
rusternetes-cri = { path = "../cri" }
rusternetes-streamproxy = { path = "../streamproxy" }
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
sha2 = "0.10"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
futures.workspace = true
chrono.workspace = true
axum.workspace = true
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { workspace = true }
futures-util = "0.3"
async-stream.workspace = true
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tonic.workspace = true
tonic-health.workspace = true
prost.workspace = true
http = "1"
tar = "0.4"
sysinfo = "0.32"
rustix = { version = "1", features = ["fs"] }
async-trait = { workspace = true }
# CSI Node-service client dials the driver's unix socket (same connector shape
# as rusternetes-cri): tonic 0.12 rides hyper 1.x, so a tokio UnixStream is
# wrapped in hyper_util's TokioIo.
hyper-util = { version = "0.1", features = ["client", "tokio"] }
tower = { workspace = true }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
serial_test = { workspace = true }
url = "2.5"
http-body-util = "0.1"
tokio = { version = "1", features = ["test-util"] }
# Fake CSI driver gRPC server over a unix socket (volume_plugins::csi_client).
tokio-stream = { version = "0.1", features = ["net"] }
# Real-TLS test server for HTTPS lifecycle-hook coverage (NC prestop-https).
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }

[package]
name = "k3rs-dns"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "k3rs_dns"
path = "src/lib.rs"

[[bin]]
name = "k3rs-dns"
path = "src/main.rs"

[features]
mimalloc = ["dep:mimalloc"]
default = []
sqlite = ["k3rs-storage/sqlite"]
redis = ["k3rs-storage/redis"]

[dependencies]
mimalloc = { version = "0.1", optional = true }
k3rs-common = { path = "../common" }
k3rs-storage = { path = "../storage" }
k3rs-client = { path = "../client" }
tokio.workspace = true
async-trait.workspace = true
anyhow.workspace = true
tracing.workspace = true
clap.workspace = true
serde_json = { workspace = true }
futures = { workspace = true }
hickory-server = { version = "0.26", default-features = false }
hickory-proto = { version = "0.26", default-features = false }

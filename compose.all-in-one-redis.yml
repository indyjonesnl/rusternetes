# All-in-one rusternetes with Redis storage.
#
# Three containers: the rusternetes binary (API server, scheduler,
# controller manager, kubelet), Redis, and a bundled containerd CRI runtime.
# Rhino's RedisBackend is embedded in the binary — no separate rhino server
# needed.
#
# Usage:
#   podman compose -f compose.all-in-one-redis.yml build
#   podman compose -f compose.all-in-one-redis.yml up -d
#
# Requires the rhino repo adjacent to this one:
#   dev/
#     rusternetes/   (this repo)
#     rhino/         (https://github.com/calfonso/rhino)

services:
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: rusternetes-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - rusternetes-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  rusternetes:
    build:
      context: ..
      dockerfile: rusternetes/all-in-one.Dockerfile
      args:
        CARGO_FEATURES: redis
        RUSTERNETES_GIT_SHA: "${RUSTERNETES_GIT_SHA-}"
    container_name: rusternetes
    privileged: true
    depends_on:
      redis:
        condition: service_healthy
      containerd:
        condition: service_started
    # Joins containerd's netns (see the `containerd` service): host ports,
    # the network attachment and aliases live on that service.
    network_mode: "service:containerd"
    volumes:
      - ./.rusternetes/certs:/etc/kubernetes/pki:ro
      - containerd-run:/run/containerd
      - ${KUBELET_VOLUMES_PATH}:${KUBELET_VOLUMES_PATH}:rw,rshared
      # CSI attach/detach socket dir (#3746), off by default; uncomment together
      # with the "--csi-attacher" block in `command:` below. The in-process
      # controller-manager dials the driver socket from inside this container, so
      # its directory is bind-mounted at the same path, read-write -- kubeadm's
      # flexvolume-dir mount for the kube-controller-manager
      # (cmd/kubeadm/app/phases/controlplane/volumes.go:73-79); the multi-container
      # stack does the same via CSI_ATTACHERS in bootstrap-cluster.sh (#3133).
      #   - /var/lib/kubelet/plugins/csi-hostpath:/var/lib/kubelet/plugins/csi-hostpath:rw
    environment:
      - RUST_LOG=info
      - CONTAINER_RUNTIME_ENDPOINT=unix:///run/containerd/containerd.sock
      - KUBERNETES_SERVICE_HOST_OVERRIDE=10.89.0.10
      - KUBELET_VOLUMES_PATH=${KUBELET_VOLUMES_PATH}
    command:
      - "--storage-backend"
      - "redis"
      - "--redis-url"
      - "redis://redis:6379"
      - "--tls"
      - "--tls-cert-file"
      - "/etc/kubernetes/pki/api-server.crt"
      - "--tls-key-file"
      - "/etc/kubernetes/pki/api-server.key"
      # Front-proxy authn (#3423): kubeadm flag set; CA/cert from generate-certs.sh.
      # Client-cert authn CA, as kubeadm passes it next to the front-proxy CA: without it the
      # listener trusts only the front-proxy CA and rejects cluster-CA client certs (#3423).
      - "--client-ca-file"
      - "/etc/kubernetes/pki/ca.crt"
      - "--requestheader-client-ca-file"
      - "/etc/kubernetes/pki/front-proxy-ca.crt"
      - "--requestheader-allowed-names"
      - "front-proxy-client"
      - "--requestheader-username-headers"
      - "X-Remote-User"
      - "--requestheader-group-headers"
      - "X-Remote-Group"
      - "--requestheader-extra-headers-prefix"
      - "X-Remote-Extra-"
      # CSI attach/detach (#3128), off by default. Uncomment together with the
      # driver socket-dir mount in `volumes:` above (#3746); SOCKET's directory
      # must be the mounted one:
      #   - "--csi-attacher"
      #   - "hostpath.csi.k8s.io=/var/lib/kubelet/plugins/csi-hostpath/csi.sock"
      #   - "--attach-detach-controller"
      - "--disable-proxy"
      - "--console-dir"
      - "/app/console"
      - "--cluster-dns"
      - "10.96.0.10"
      - "--volume-dir"
      - "${KUBELET_VOLUMES_PATH}"

  # CRI runtime: containerd (CRI plugin) + Youki, bundled exactly like the
  # `containerd` service in compose.sqlite.yml. The all-in-one binary talks CRI
  # v1 to it over the shared `containerd-run` volume instead of a host
  # Podman/Docker socket, so this stack runs unchanged on Docker or Podman.
  # containerd owns the pod network namespace (cni0 bridge, iptables), so the
  # `rusternetes` service joins THIS service's netns (network_mode below):
  # the in-process kube-proxy then programs Service DNAT rules where the pod
  # IPs live, and the node IP the kubelet advertises is reachable by pods.
  # Single node: CNI_CONF_FROM_NODE_IPAM stays unset, so the cluster-wide
  # conflist baked into the image applies (main.rs keeps node_net: None).
  containerd:
    image: rusternetes-containerd:latest
    build:
      context: .
      dockerfile: containerd.Dockerfile
    container_name: rusternetes-containerd
    restart: unless-stopped
    privileged: true
    ports:
      - "6443:6443"
      - "10250:10250"
      - "10257:10257"
    networks:
      rusternetes-net:
        ipv4_address: 10.89.0.10
        aliases:
          - api-server
    volumes:
      - containerd-run:/run/containerd
      # /var/lib/containerd (the overlayfs snapshotter root) must live on a real
      # filesystem, not the container's own overlay rootfs — nested overlay
      # mounts fail with "invalid argument". A named volume is host-fs-backed.
      - containerd-data:/var/lib/containerd
      # rshared so the tmpfs mounts the kubelet makes for Memory-medium emptyDir
      # volumes propagate to where containerd resolves container bind mounts.
      - ${KUBELET_VOLUMES_PATH}:${KUBELET_VOLUMES_PATH}:rw,rshared

networks:
  rusternetes-net:
    driver: bridge
    name: rusternetes-network
    ipam:
      config:
        - subnet: 10.89.0.0/24

volumes:
  redis-data:
    name: rusternetes-redis-data
  # CRI socket shared from the containerd service to the rusternetes binary.
  containerd-run:
    name: rusternetes-containerd-run
  containerd-data:
    name: rusternetes-containerd-data

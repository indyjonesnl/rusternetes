# Pull registry.k8s.io images from the ghcr.io mirror first, then fall back to
# registry.k8s.io itself. containerd tries [host.*] entries in order and then
# the `server` below; a 404 (image not mirrored) or an unreachable mirror falls
# through to it. Pod specs and image names are unchanged.
#
# Mirror contents: ci/mirror/images.txt, populated by
# .github/workflows/mirror-images.yml.
#
# override_path: the host URL below already includes the /v2 API root plus the
# mirror namespace, so containerd must not append its own /v2 (containerd
# docs/hosts.md "override_path field"; same form as the namespaced-mirror
# example there). registry.k8s.io/<path> -> ghcr.io/indyjonesnl/rusternetes/mirror/<path>.
server = "https://registry.k8s.io"

[host."https://ghcr.io/v2/indyjonesnl/rusternetes/mirror"]
  capabilities = ["pull", "resolve"]
  override_path = true
  # Fail over quickly when the mirror is unreachable (containerd docs/hosts.md).
  dial_timeout = "5s"

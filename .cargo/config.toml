# Workspace cargo config.
#
# This file is checked in. Local developer-only customizations
# (mold linker, sccache, etc.) live in the commented section at the
# bottom — uncomment locally as you see fit. Cargo merges with
# `~/.cargo/config.toml`, so per-machine settings can live there
# instead if you'd rather not edit this file.

# ────────────────────────────────────────────────────────────────────
# Local-dev opt-ins — uncomment as desired.
# ────────────────────────────────────────────────────────────────────
#
# mold linker: 3-5x faster incremental rebuilds for the api-server +
# kubelet binaries. Requires:
#   sudo apt-get install -y mold clang
# CI's self-hosted runner has these preinstalled but does NOT set
# this rustflag — CI compiles with the system ld so we don't paper
# over any mold-specific issues in release builds.
#
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]
